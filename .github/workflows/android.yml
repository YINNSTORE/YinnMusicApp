name: Android Build (Normal Release)

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Normal Release APK
        run: ./gradlew :app:assembleNormalRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YinnMusic-Normal-Release
          path: app/build/outputs/apk/normal/release/*.apk
      - name: Build Normal Release APK (capture log)
  run: |
    set -o pipefail
    ./gradlew :app:assembleNormalRelease --no-daemon --stacktrace --info 2>&1 | tee build.log

- name: Show only AAPT/resource errors
  if: always()
  run: |
    echo "==== FILTERED ERRORS (AAPT/resource/duplicate/not found) ===="
    grep -nE "AAPT:|Android resource linking failed|Duplicate resources|resource .* not found|error:" build.log | tail -n 200

- name: Upload build log
  if: always()
  uses: actions/upload-artifact@v4
  with:
    name: build-log
    path: build.log