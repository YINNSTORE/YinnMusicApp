name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Normal Release APK
        run: ./gradlew :app:assembleNormalRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YinnMusic-Normal-Release
          path: app/build/outputs/apk/normal/release/*.apk